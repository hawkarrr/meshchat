# Checks every push: static analysis and the automated tests (all simulated),
# and builds the Android app so the Kotlin code is compiled too. Runs once the
# project is in a GitHub repository; it does nothing until then.
name: CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # The radio tests use short timeouts on purpose; on a very busy runner one
      # can fail without anything being wrong (see README, "Automated tests").
      - run: flutter test --concurrency=2

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
