
name: offline_mesh_chat
description: "Damatqe: an offline, peer-to-peer Bluetooth mesh messenger with private chats, groups and public rooms. No internet, no servers."
publish_to: 'none'
version: 0.2.0+2
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.3

  # Bluetooth / connectivity
  bluetooth_low_energy: ^6.2.1
  connectivity_plus: '>=7.3.1 <7.3.2'
  device_info_plus: ^13.3.0

  # Local database
  sqflite: ^2.4.4+2
  path: ^1.9.1
  path_provider: ^2.1.6

  # Cryptography and key storage
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0

  # Permissions, voice messages and images
  permission_handler: ^12.0.2
  record: ^7.1.2
  audioplayers: ^6.8.1
  image_picker: ^1.1.2
  image: ^4.12.0
  flutter_local_notifications: ^22.3.2
  video_player: ^2.14.1
  gal: ^2.3.3
  share_plus: ^13.3.1
  animated_theme_switcher: ^2.0.10
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device checks of the plugins: `flutter test integration_test -d <phone>`.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  # The tests open SQLite on the computer (Windows, macOS, Linux) through FFI.
  sqflite_common_ffi: ^2.4.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/branding/logo.png
    - assets/fonts/OFL.txt

  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_full.png"
  min_sdk_android: 24
  remove_alpha_ios: true
  adaptive_icon_background: "#0b1527"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"